spring.application.name=banhmyking

# Datasource (url/username/password) + server.port nằm ở application-dev.properties
spring.datasource.password=${DB_PASSWORD:}
spring.profiles.active=dev

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:DayLaMotChuoiBaoMatChoDuAnBanhMyKingRatDaiVaAnToan123}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-days=7

# Cấu hình phí giao hàng (Delivery Fee & Freeship)
delivery.base-distance-km=2.0
delivery.base-fee=15000
delivery.fee-per-km=5000
delivery.urban-fee=15000
delivery.suburban-fee=30000
delivery.freeship-threshold=200000
