spring.application.name=banhmyking

# Datasource (url/username/password) + server.port nằm ở application-dev.properties
spring.datasource.password=${DB_PASSWORD}
spring.profiles.active=dev

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-days=7

# Xác thực email khi đăng ký
app.frontend-base-url=${FRONTEND_BASE_URL:}
app.verification-token-expiry-hours=1
app.reset-token-expiry-minutes=30

# Email gửi đi (Gmail SMTP). Bật 2FA ở Google Account rồi tạo App Password 16 ký tự.
# Điền MAIL_USERNAME / MAIL_PASSWORD ở application-dev.properties (file local, không commit).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cấu hình phí giao hàng (Delivery Fee & Freeship)
delivery.base-distance-km=2.0
delivery.base-fee=15000
delivery.fee-per-km=5000
delivery.urban-fee=15000
delivery.suburban-fee=30000
delivery.freeship-threshold=200000

# SePay Webhook Integration 
sepay.api-key=${SEPAY_API_KEY:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:8888332999}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

